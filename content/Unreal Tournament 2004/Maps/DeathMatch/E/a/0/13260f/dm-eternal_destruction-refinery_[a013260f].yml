description: "Part of an abandoned refinery that was part of a take over deal by the\
  \ eternal corperation. With pressure from lanandri they altered it for use as a\
  \ tournament arena but eternal was different and so staged the first ever Destruction\
  \ Deathmatch. This involved the competitors having to destroy parts of the terrain\
  \ to gain access to the rest of the arena. Restrictions: do not use low grav, regeneration\
  \ is included as standard as there are no health pickups and no bot support."
