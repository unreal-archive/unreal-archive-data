author: "Socio/Coyotek"
description: "This scenario recreates a lesser known event from the period of corporation\
  \ wars. A night time assault of Izanagi corporations commando strike force on Liandri\
  \ corporations tarydium mining station named Mercury on the planet Zeus VII. Mercury\
  \ was, Liandris biggest tarydium mining depot connected directly with the main mine\
  \ complex under Akrum mountain region via an underground high-speed rail road. The\
  \ station shipped hundreds tons of tarydium daily and therefore was a great income\
  \ for Liandri and salt in the eye for Izanagi. Using a seen once in 100 years meteo\
  \ storm, that wrecked havoc to Mercurys communication system, Izanagi, sent its\
  \ elite strike force, equipped with an powerfull, experimental Ex-T bomb to blow\
  \ the mines and station up, crippling Liandri corporations strenght on planet Zeus\
  \ VII."
