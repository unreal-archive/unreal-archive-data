description: "With this arena losing popularity over the years, it stood out like\
  \ a sore thumb among not only other assault arenas, but also among areas surrounding\
  \ it. Poor aesthetics is one thing, but polution is the bigger problem. Over the\
  \ years this area has caused major damage to local wildlife and welfare of nearby\
  \ cities. Ecological society decided that this place will be perfect for land reclamation\
  \ and forestation, so they paid a hefty sum to get rid of all the junk surrounding\
  \ it. In addition to this, we have redecorated this area to fit the christmas holiday\
  \ theme! So take a deep breath and feel the christmas spirit... Oh sorry, this was\
  \ a pain from the shock mine explosion."
