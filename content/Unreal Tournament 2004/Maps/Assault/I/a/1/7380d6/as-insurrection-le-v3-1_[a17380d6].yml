description: "Last area designed by Calum, rest made by Frederic Doiron | This scenario\
  \ marks the sudden end of the many uprisings in Liandri's deep space mining colonies.\
  \  When it was discovered that the miners of JV-A06 Facilities were illegally selling\
  \ parts of the rich minerals to the hellions, Liandri decided to take disciplinary\
  \ action against its workers. This quickly escalated in an all-out rebellion.  The\
  \ insurgents, fighting with advanced weaponry bought from the Hellions, managed\
  \ to defeat the small Liandri fleet that had been dispatched there. News of this\
  \ quickly spread throughout the Holovision network.  Before the situation grew out\
  \ of control, the Liandri commanders devised a plan to dispose of the rebels as\
  \ brutally as possible for all the known universe to see, live on Holovision.  A\
  \ small team of commandos would infiltrate the facilities and strike at the support\
  \ pillar anchoring the complex to a large asteroid orbiting JV-A06, effectively\
  \ sending the entire complex, and its population, to crash and burn in the planet's\
  \ atmosphere.  The event was immensely popular, and caused the other colonies to\
  \ think twice about revolting. A tournament classic was born."
