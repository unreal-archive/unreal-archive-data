name: "Fragball"
author: "Brad 'fragbert' Shapcott"
description: "A team sport game type in which two teams compete to put a ball into\
  \ the opposing goal. The Impact Hammer is modified so that a carrier can shoot the\
  \ ball, and the mod ships with a large set of purpose-built arenas and four mutators."
