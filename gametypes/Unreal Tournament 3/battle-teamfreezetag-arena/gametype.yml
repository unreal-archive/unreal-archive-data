contentType: "GameType"
addedDate: "2026-09-19"
game: "Unreal Tournament 3"
name: "Battle Team/Freezetag Arena"
author: "Nico de Vries"
description: "Four round-based arena game types in one package: Battle Team Arena,\
  \ where you get one life per round, Battle Freezetag Arena, where being shot freezes\
  \ you until a team mate thaws you, and instagib versions of both. Everyone spawns\
  \ fully armed, pickups are stripped from the map, and a 3D radar, anti-camping timer\
  \ and detailed round statistics keep clan matches honest."
