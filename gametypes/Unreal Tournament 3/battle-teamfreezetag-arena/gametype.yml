  V10 UT3 Compatibility Fix:
  - "Shambler"
gameTypes:
- name: "Battle Team Arena"
  description: "You can die only once. Once all members of a team are eliminated the\
    \ other team gets a point and wins the round."
- name: "Battle Freezetag Arena"
  description: "Instead of getting killed you get frozen. Once all members of a team\
    \ are frozen or dead the other team gets a point and wins the round."
- name: "Battle Instagib Arena"
  description: "Identical to Battle Team Arena, but every player gets an Instagib\
    \ rifle."
- name: "Battle Insta Freeze Arena"
  description: "Identical to Battle Freezetag Arena, but every player gets an Instagib\
    \ rifle and thaw speed is doubled."
