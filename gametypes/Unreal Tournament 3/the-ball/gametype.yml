game: "Unreal Tournament 3"
name: "The Ball"
author: "Toltec Studios"
description: "A single player action/puzzle total conversion set in an Aztec temple\
  \ inside a dormant Mexican volcano. An ancient device lets you push and pull a large\
  \ physics-driven ball, which is used to solve puzzles, trigger mechanisms and crush\
  \ the temple's undead guardians. Winner of five first places across Epic's Make\
  \ Something Unreal Contest, and ModDB's Best Singleplayer Mod of 2008; later reworked\
  \ into a standalone commercial game on UDK."
