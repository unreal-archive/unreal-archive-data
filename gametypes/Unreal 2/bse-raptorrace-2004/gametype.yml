game: "Unreal 2"
name: "BSE RaptorRace 2004"
author: "Team BSE"
description: "A racing mod for Unreal II: XMP. Six purpose-built tracks are raced\
  \ in souped-up Raptor vehicles; the mod is entirely map-embedded, so a server only\
  \ needs to select one of the RaptorRace maps. Two mutators are included, one to\
  \ fix both teams' energy for practice sessions and one to drop the race Raptors\
  \ and Juggernauts into ordinary XMP levels."
