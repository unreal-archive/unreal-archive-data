name: "Flag Domination"
author: "David Catmull"
description: "The UT2004 sequel to the original Unreal Tournament game type, mixing\
  \ Capture the Flag with Domination. Neutral flags must be carried to your team's\
  \ capture point, and can be stolen back. Four scoring modes are offered - Rounds,\
  \ Timed, Scavenger and Incursion - along with Vehicle Flag Domination, which plays\
  \ on Onslaught maps with flags placed where the power nodes and cores would be."
