gameTypes:
- name: "CTF4"
  description: "Your team must score flag captures by taking the enemy flags from\
    \ the enemy bases and returning it to their own flag.  If the flag carrier is\
    \ killed, the flag drops to the ground for anyone to pick up.  If your team's\
    \ flag is taken, it must be returned (by touching it after it is dropped) before\
    \ your team can score a flag capture."
- name: "TDM4"
  description: "Up to four teams duke it out in a quest for battlefield supremacy.\
    \  The team with the most total frags wins."
