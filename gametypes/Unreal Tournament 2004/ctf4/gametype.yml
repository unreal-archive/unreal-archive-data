game: "Unreal Tournament 2004"
name: "CTF4"
author: "Greg \"Overload\" Laabs"
description: "Capture the Flag with four teams instead of two - red, blue, green and\
  \ gold - plus four team Team Deathmatch. Adds green and gold player skins, its own\
  \ announcers, scoring modes that decide which flags you may take, four team bot\
  \ support and a pack of fourteen four team maps."
