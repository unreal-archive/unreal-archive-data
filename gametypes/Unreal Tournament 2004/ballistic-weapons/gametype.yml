gameTypes:
- name: "Ballistic BR"
  description: "Standard Bombing Run with Ballistic Weapons in Normal, Loadout, Arena\
    \ or Melee configuration and other features such as Dark Players."
- name: "Ballistic CTF"
  description: "Standard CTF with Ballistic Weapons in Normal, Loadout, Arena or Melee\
    \ configuration and other features such as Dark Players."
- name: "Ballistic Conflict"
  description: "Rival teams prepare for battle and must eliminate the entire enemy\
    \ team to score!||A round based Ballistic Weapons game where teams start on opposite\
    \ sides of the map and players have a chance to choose their starting loadout.\
    \ Dead players don't respawn until the next round. When one team has been completely\
    \ eliminated the round ends and teams are reset to a starting location.||www.runestorm.com"
- name: "Ballistic Conflict (CTF Maps)"
  description: "Standard Ballistic Conflict, but played in the CTF maps.||www.runestorm.com"
- name: "Ballistic DeathMatch"
  description: "Standard Deathmatch with Ballistic Weapons in Normal, Loadout, Arena\
    \ or Melee configuration and other features such as Dark Players."
- name: "Ballistic Onslaught"
  description: "Standard Onslaught with Ballistic Weapons in Normal, Loadout, Arena\
    \ or Melee configuration and other features such as Dark Players."
- name: "Ballistic Team DM"
  description: "Standard Team Deathmatch with Ballistic Weapons in Normal, Loadout,\
    \ Arena or Melee configuration and other features such as Dark Players."
mutators:
- name: "BE Vehicle Pack"
  description: "Replaces original vehicles with two new, more realistic one's, that\
    \ include custom sounds, kill messages, projectiles, UI, and a whole lot more....\
    \ ||WARNING!! Do not use with other vehicle mutators that replace the Raptor,\
    \ and the Goliath.||http://www.runestorm.com"
- name: "Ballistic Arena"
  description: "Like arena, but with all Ballistic items and modifications and the\
    \ option of multiple/random weapons.||http://www.runestorm.com"
- name: "Ballistic Evolution Loadout"
  description: "Play Ballistic Weapons like normal Loadout, but to access more weapons,\
    \ you will need to reach certain levels of acheivement:|Match Time: Some weapons\
    \ are only accesable when the match has played for a while|Frags: Your basic frag\
    \ count|Efficency: How efficiently you use your lives (frags divided by deaths)|Damage\
    \ Rage: How much you actually contribute to each of your kills (Total Damage Dealt\
    \ divided by Kills)|Sniper Efficiency: Your efficiency at taking headshots and\
    \ long range fighting (Headshots+RangeBonus divided by Deaths using Sniper weapons)|Shotgun\
    \ Efficiency: Your efficiency at close range gun combat (Close range gun Frags\
    \ divided by Deaths with Shotguns)|Hazard Efficiency: Your efficiency with hazardous\
    \ weapons (Frags with hazardous weapons divided by deaths with hazardous weapons)||http://www.runestorm.com"
- name: "Ballistic Evolution Scaling"
  description: "You can use this mutator to set requirement scaling for Ballistic\
    \ Evolution.||http://www.runestorm.com"
- name: "Ballistic Loadout"
  description: "Play ballistic weapons, but instead of picking up weapons, you can\
    \ choose five to start with, Melee, Sidearm, Primary, Secondary and Grenade. Ammo\
    \ Packs replace weapon pickups and extra weapons can be taken from your enemies.||http://www.runestorm.com"
- name: "Ballistic Melee"
  description: "Play with Ballistic Weapons mutator using only the melee weapons.||http://www.runestorm.com"
- name: "Ballistic Regeneration"
  description: "Periodically restores health to injured players and vehicles, and\
    \ awards bonus player health for kills...||http://www.runestorm.com"
- name: "Ballistic Sprint"
  description: "This mutator gives players the ability to sprint for a short period\
    \ of time. Sprint key can be set in the controls configuration menu. It is recommended\
    \ that you use this when playing with Ballistic Weapons as the weapons have integrated\
    \ support for player sprinting."
- name: "Ballistic Vehicles"
  description: "Replaces vehicles with ones modified to fit in better with BW."
- name: "Ballistic Weapons"
  description: "Applies Ballistic Weapons mod. Replaces original weapons with the\
    \ Ballistic weapons and implements all the new features and options including:\
    \ reloading, recoil, inaccuracy, improved damage, iron sights, firing modes, new\
    \ effects, new sounds, new items, altered player movement, etc... All options\
    \ are accesible through the 'configure mutator' menu and the swapping lists can\
    \ be used to change which weapons are spawned and how...||http://www.runestorm.com"
- name: "Bloody Hell"
  description: "Adds horrific blood effects for dead bodies, including: blood trails,\
    \ corpse impact marks, blood pools and under water blood. The pinnacle of horrendousness...||http://www.runestorm.com"
- name: "Itemizer"
  description: "Adds in items that have been manually placed with the Itemizer Tool"
- name: "Itemizer Tool"
  description: "Warning: This is not a toy! The Itemizer is a tool to use for manually\
    \ placing items in maps of any gametype. If you are adding items for a new gametype,\
    \ you should have prepared an item database before using this tool. In order to\
    \ play with the items placed by this tool, you will need to use a mutator that\
    \ uses the Itemizer system, such as Itemizer or Ballistic Weapons."
- name: "Junk War"
  description: "Battle it out with whatever you can get your hands on! All manner\
    \ of junk is dotted around the arena, everything from rusted old pipes, crowbars\
    \ and spanners to ice picks, tazers and empty beer bottles, it can all be used\
    \ as a weapon... ||http://www.runestorm.com"
