gameTypes:
- name: "Build CTF"
  description: "Your team must score flag captures by taking the enemy flag from the\
    \ enemy base and returning it to their own flag.  If the flag carrier is killed,\
    \ the flag drops to the ground for anyone to pick up.  If your team's flag is\
    \ taken, it must be returned (by touching it after it is dropped) before your\
    \ team can score a flag capture."
- name: "Monster Master"
  description: "Each player starts with a limited number of lives.  The goal is to\
    \ be the last player left when the smoke clears."
- name: "U4E2D"
  description: "Play in a 2D environment, change the gametype under the Game Rules\
    \ tab. If you want to change gametype specific gamerules, go to the Game Rules\
    \ tab of that gametype."
mutators:
- name: "Damage Identifier"
  description: "Damage will be visible above the victem's head."
- name: "U4E: IAM replacer"
  description: "Replaces the any weapon with the IAM. Also allows an non-overheating\
    \ version"
- name: "U4E: berzerk"
  description: "Every kill gets you 20 points, get 100 and go berzerk!"
- name: "UFO"
  description: "Replaces the Raptor with the UFO"
- name: "Unreal4Ever"
  description: "Play with Unreal4Ever weapons"
