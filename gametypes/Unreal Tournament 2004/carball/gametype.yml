problemLinks: {}
credits: {}
gameTypes:
- name: "Car Ball"
  description: "Your team must score points by knocking a giant, bouncing, indestructible\
    \ ball into the opponent's goal area using one of four different vehicle types.\
    \ The team with the most goals at the end of the match, wins. Vehicle acrobatics\
    \ and power-ups bring excitement and fun to every moment of the game!"
mutators:
- name: "CarBall - Arena"
  description: "Replace all CarBall Powerups in map."
- name: "CarBall - Invis Mutator"
  description: "Changes the invis powerup so you can see other peoples items instead\
    \ of becoming invisible. (Makes primary and secodary fire modes the same)"
- name: "CarBall - No Alt Fire Weapons"
  description: "Disables the CarBall alternate fire mode on all pickups."
- name: "CarBall - No CarBall SuperWeapons"
  description: "CarBall SuperWeapon pickups are removed from the map."
- name: "CarBall - No Powerups"
  description: "Removes all CarBall Powerups in map. Allows "
- name: "CarBall - No Weapon Damage"
  description: "Disables damage from all pickups, though you will still be knocked\
    \ around."
