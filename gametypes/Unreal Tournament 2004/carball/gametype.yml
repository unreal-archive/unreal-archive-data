game: "Unreal Tournament 2004"
name: "Carball"
author: "Carball Dev Team"
description: "Soccer played with vehicles and a giant indestructible ball. Teams drive\
  \ dune buggies capable of jumps, flips and other acrobatics, using power-ups and\
  \ weapons mostly on the ball rather than on each other. Cars can be customised with\
  \ skins, wheels and licence plates."
titleImage: "title.png"
